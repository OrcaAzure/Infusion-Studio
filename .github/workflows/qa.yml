name: QA

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  offline-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run qa:offline

  web-qa:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:push -- --accept-data-loss
      - run: npm run db:seed
      - run: npm run build
      - run: npm run start &
        env:
          PORT: 3000
          SKIP_AUTH: "true"
          DATABASE_URL: file:./dev.db
          ALLOW_LOCAL_PREVIEW: "true"
      - run: npx wait-on http://localhost:3000 && npm run qa:web
        env:
          SKIP_AUTH: "true"
