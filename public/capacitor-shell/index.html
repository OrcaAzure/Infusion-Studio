<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <title>Infusion Studio</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #064e3b 0%, #0c0a09 100%);
        color: #fafaf9;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 360px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 20px;
        padding: 28px;
        backdrop-filter: blur(12px);
        text-align: center;
      }
      .logo {
        width: 64px; height: 64px;
        margin: 0 auto 16px;
        border-radius: 16px;
        background: #059669;
        display: flex; align-items: center; justify-content: center;
        font-size: 28px;
      }
      h1 { font-size: 22px; margin-bottom: 6px; }
      p { font-size: 13px; color: rgba(255,255,255,0.65); margin-bottom: 20px; }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.2);
        background: rgba(0,0,0,0.3);
        color: #fff;
        font-size: 14px;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #059669;
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { background: #047857; }
      .status { margin-top: 16px; font-size: 12px; color: rgba(255,255,255,0.5); }
      .spinner {
        display: inline-block;
        width: 18px; height: 18px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #34d399;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        vertical-align: middle;
        margin-right: 8px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="card" id="connecting" style="display:none">
      <div class="logo">💧</div>
      <h1>Infusion Studio</h1>
      <p class="status"><span class="spinner"></span>Connecting…</p>
    </div>

    <div class="card" id="setup">
      <div class="logo">💧</div>
      <h1>Infusion Studio</h1>
      <p>Enter the server URL from your developer, then tap Connect.</p>
      <input id="serverUrl" type="url" placeholder="https://your-server-url" />
      <button onclick="connect()">Connect</button>
      <p class="status">QA login: trial@trial.com / trial123</p>
    </div>

    <script>
      // Default server — updated when APK is built (see scripts/build-apk.ps1)
      const DEFAULT_SERVER = "https://lazy-parents-lead.loca.lt";
      const STORAGE_KEY = "infusion_server_url";

      function connect(url) {
        const target = (url || document.getElementById("serverUrl").value || DEFAULT_SERVER).replace(/\/$/, "");
        if (!target.startsWith("http")) return;
        localStorage.setItem(STORAGE_KEY, target);
        document.getElementById("setup").style.display = "none";
        document.getElementById("connecting").style.display = "block";
        window.location.href = target + "/dashboard";
      }

      const saved = localStorage.getItem(STORAGE_KEY) || DEFAULT_SERVER;
      document.getElementById("serverUrl").value = saved;

      // Auto-connect on launch (change to false to always show setup screen)
      const AUTO_CONNECT = true;
      if (AUTO_CONNECT && saved) {
        connect(saved);
      }
    </script>
  </body>
</html>
